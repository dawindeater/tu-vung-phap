<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script defer src="https://cloud.umami.is/script.js" data-website-id="5880baf0-1e5a-4f5e-98c4-6c65fb98dd7f"></script>
<meta name="description" content="Từ Vựng Pháp: học từ vựng tiếng Pháp theo chủ điểm, mỗi ngày một ít.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f8ecc0'/%3E%3Cellipse cx='16' cy='18' rx='8' ry='10' fill='%23fffdf9' stroke='%232d2a32' stroke-width='1.8'/%3E%3C/svg%3E">
<title>Từ Vựng Pháp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap">
<style>
/* Phong cách: sổ tay giấy, tối giản, nhiều khoảng trắng. Chữ tiêu đề có chân (Fraunces), chữ thường không chân (Be Vietnam Pro).
   Màu: nền giấy kem, các thẻ dùng 6 màu pastel (bơ, đào, bạc hà, oải hương, trời, hồng phấn), nút màu xanh xô thơm. */
:root{
  --paper:#fbf7f1; --surface:#fffdf9; --ink:#2d2a32; --muted:#6f6a73; --line:#e7e0d5; --line-strong:#cdc3b4;
  --accent:#4f7a68; --accent-ink:#ffffff; --accent-soft:#e3efe8;
  --good:#3f7d5c; --good-soft:#e1f1e7; --bad:#b4544a; --bad-soft:#f9e4e0;
  --butter:#f8ecc0; --peach:#f8dccb; --mint:#d7ecdf; --lilac:#e5ddf3; --sky:#d8e7f3; --blush:#f5dbe2;
  --coop:#fdf1e4; --coop-panel:#fffaf3;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1b20; --surface:#26232a; --ink:#efe9e1; --muted:#aaa2a9; --line:#3a3640; --line-strong:#56505c;
    --accent:#93c4ad; --accent-ink:#1d1b20; --accent-soft:#2c3b34;
    --good:#7fcaa0; --good-soft:#233a2e; --bad:#f09a8f; --bad-soft:#40272a;
    --butter:#4a4230; --peach:#4c372e; --mint:#2f4339; --lilac:#3b3449; --sky:#2d3d4a; --blush:#4a3239;
    --coop:#2c2722; --coop-panel:#35302a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1d1b20; --surface:#26232a; --ink:#efe9e1; --muted:#aaa2a9; --line:#3a3640; --line-strong:#56505c;
  --accent:#93c4ad; --accent-ink:#1d1b20; --accent-soft:#2c3b34;
  --good:#7fcaa0; --good-soft:#233a2e; --bad:#f09a8f; --bad-soft:#40272a;
  --butter:#4a4230; --peach:#4c372e; --mint:#2f4339; --lilac:#3b3449; --sky:#2d3d4a; --blush:#4a3239;
  --coop:#2c2722; --coop-panel:#35302a; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);padding-block:18px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
#app.narrow{max-width:720px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* ---------- đầu trang ---------- */
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{flex:none;width:42px;height:42px;border-radius:12px;background:var(--butter);display:grid;place-items:center;border:1px solid var(--line-strong)}
.brand-name{display:block;font:600 22px/1.1 var(--f-display);letter-spacing:-.01em}
.brand-sub{display:block;font:italic 400 13px/1.3 var(--f-display);color:var(--muted)}
.icon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center}

/* ---------- mở đầu ---------- */
.hero{display:flex;flex-direction:column;gap:10px;padding:20px 0 4px;max-width:720px}
.eyebrow{font:600 11.5px/1.4 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h1{font:400 clamp(34px,6vw,56px)/1.08 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--accent)}
.lead{color:var(--muted);font-size:16.5px;max-width:560px}

/* ---------- tiêu đề mục ---------- */
.sec{display:flex;flex-direction:column;gap:18px}
.sec-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:end}
.sec-no{grid-row:1/3;font:italic 400 44px/1 var(--f-display);color:var(--line-strong);font-variant-numeric:lining-nums}
.sec-head h2{font:600 clamp(24px,3.4vw,32px)/1.15 var(--f-display);letter-spacing:-.01em}
.sec-head p{color:var(--muted);font-size:14.5px;grid-column:2}

/* ---------- trình độ ---------- */
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lv{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:16px}
.lv[disabled]{cursor:default;border-style:dashed;background:transparent}
.lv-top{display:flex;align-items:center;gap:12px}
.lv-tile{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font:600 24px/1 var(--f-display);border:1px solid var(--line-strong)}
.lv-name{font:600 15.5px/1.3 var(--f-body)}
.lv-meta{color:var(--muted);font-size:13px}
.lv-tag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.lv[disabled] .lv-tag{background:var(--line);color:var(--muted)}
.lv[disabled] .lv-tile{opacity:.75}

/* ---------- chuồng gà ---------- */
.coop{background:var(--coop);border:1px solid var(--line-strong);border-radius:26px;padding:clamp(18px,3.5vw,36px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px 28px;align-items:center}
.coop-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.coop h2{font:600 clamp(30px,4.6vw,46px)/1.05 var(--f-display);letter-spacing:-.02em}
.coop h2 em{font-style:italic;font-weight:400}
.coop .lead{font-size:15px}
.panel-soft{background:var(--coop-panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.feed-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.feed-row strong{font-weight:600}
.pct{font:600 13px/1 var(--f-body);background:var(--butter);border:1px solid var(--line-strong);border-radius:999px;padding:7px 11px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0;text-align:center}
.stages li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;line-height:1.25;color:var(--muted)}
.stages b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:600 12px/1 var(--f-body);border:1px solid var(--line-strong);background:transparent;font-variant-numeric:tabular-nums}
.stages li.past b{background:var(--mint);border-color:transparent;color:var(--ink)}
.stages li.now{color:var(--ink);font-weight:600}
.stages li.now b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.food{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.food-n{font-size:14.5px}
.streak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.streak-n{font:600 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.streak-n small{font:600 14px var(--f-body);margin-left:6px}
.streak p{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;list-style:none;margin:4px 0 0;padding:0;text-align:center}
.week li{display:flex;flex-direction:column;align-items:center;gap:5px;font:600 11px/1 var(--f-body);color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--ink)}
.week li.on i{background:var(--butter);box-shadow:inset 0 0 0 1px var(--line-strong)}
.week li.today{color:var(--ink)}
.week li.today i{box-shadow:inset 0 0 0 2px var(--accent)}
.week li.today:not(.on) i{background:transparent;outline:2px dashed var(--accent);outline-offset:-2px;box-shadow:none}
.hen{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hen svg{width:100%;max-width:340px;height:auto}
.hen-name{font:italic 600 19px/1.2 var(--f-display);text-align:center}
.status{min-height:1.4em;font-size:14px;color:var(--muted);text-align:center}
@keyframes peck{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}60%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.hen.eat svg .bird{transform-origin:50% 90%;transform-box:fill-box;animation:peck .55s ease}
.hen.grow svg .bird{transform-origin:50% 100%;transform-box:fill-box;animation:pop .65s ease}

/* ---------- thẻ chủ điểm: kiểu gáy sổ (gáy màu pastel ghi số, tên Pháp là tiêu đề, viền xếp chồng như các trang giấy) ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 30px;list-style:none;margin:0;padding:0 10px 10px 0}
.book{position:relative;display:grid;padding:0;margin:0;grid-template-columns:58px minmax(0,1fr);width:100%;height:100%;min-height:236px;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px 20px 20px 8px;overflow:hidden;
  box-shadow:5px 5px 0 -1px var(--surface),5px 5px 0 0 var(--line-strong),9px 9px 0 -1px var(--surface),9px 9px 0 0 var(--line);transition:transform .2s ease}
.book:hover{transform:translateY(-3px)}
.spine{background:var(--tint);border-right:1px solid var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0}
.spine b{font:600 24px/1 var(--f-display);font-variant-numeric:lining-nums;color:var(--ink)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10.5px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.bk{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;min-width:0}
.bk-top{display:flex;justify-content:space-between;align-items:flex-start}
.bk-lvl{font:600 12px/1 var(--f-body);letter-spacing:.12em;border:1px solid var(--line-strong);border-radius:4px;padding:5px 8px}
.bk-top svg{width:58px;height:58px;margin:-4px -2px 0 0}
.bk-fr{font:600 29px/1.1 var(--f-display);letter-spacing:-.01em;margin-top:8px;overflow-wrap:anywhere}
.bk-name{font-size:14.5px;color:var(--muted);line-height:1.45}
.bk-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:12px}
.bk-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);display:block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.arr{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink);font-size:15px}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:var(--surface)}
.ic .d{fill:var(--ink);stroke:none}
.done-badge{color:var(--good);font-weight:600}

/* ---------- chủ điểm, bài học ---------- */
.back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);font-size:14.5px}
.back:hover{color:var(--ink)}
.banner{position:relative;background:var(--tint);border-radius:22px;border:1px solid var(--line-strong);padding:22px 22px 20px;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:flex-end}
.banner::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(45,42,50,.09) 1px, transparent 1.2px);background-size:12px 12px;pointer-events:none}
.banner > *{position:relative;z-index:1}
.banner svg.ic-big{position:absolute;right:18px;top:16px;width:92px;height:92px}
.banner h1{font:600 clamp(26px,5vw,36px)/1.15 var(--f-display);max-width:calc(100% - 100px);text-wrap:balance}
.banner .sub{font-size:14px;color:var(--muted)}
.banner .fr{font:italic 400 18px/1.2 var(--f-display)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lrow{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;padding:14px 16px}
.lrow:hover{border-color:var(--accent)}
.lno{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint,var(--butter));font:600 17px/1 var(--f-display)}
.lname{display:block;font:600 16px/1.35 var(--f-body)}
.lmeta{display:block;color:var(--muted);font-size:13.5px}
.lstate{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:4px;align-self:flex-start}
.tabs button{background:none;border:0;padding:8px 18px;border-radius:999px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.notice{background:var(--butter);border-radius:14px;padding:12px 16px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn.small{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.card{position:relative;width:100%;min-height:250px;border:1px solid var(--line-strong);border-radius:22px;background:var(--tint,var(--butter));padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.card::before{content:"";position:absolute;inset:12px;border:1px dashed rgba(45,42,50,.22);border-radius:14px;pointer-events:none}
.card .w{font:600 clamp(32px,8vw,48px)/1.15 var(--f-display);overflow-wrap:anywhere}
.card .m{font:600 clamp(22px,6vw,30px)/1.3 var(--f-body)}
.card .hint{font-size:13px;color:var(--muted)}
.card .pos{font:italic 400 16px var(--f-display);color:var(--muted)}
.card .note{font-size:15px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;font-size:14px}
.speak{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.speak[disabled]{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.li .fr{font:600 19px/1.25 var(--f-display)}
.li .tr{color:var(--ink);font-size:14.5px}
.li .exs{grid-column:1/-1;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h3{font:600 20px/1.3 var(--f-display)}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.qtype{font-weight:600;color:var(--ink)}
.big{font:600 clamp(28px,7vw,40px)/1.2 var(--f-display);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.big .speak{font-family:var(--f-body);font-weight:500}
.hintline{color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line-strong);border-radius:14px;padding:13px 16px;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
input[type=text]{width:100%;font:500 20px var(--f-display);padding:12px 16px;border:1px solid var(--line-strong);border-radius:14px;background:var(--paper);color:var(--ink)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{min-width:40px;border:1px solid var(--line-strong);background:var(--paper);border-radius:10px;padding:6px 10px;font:500 18px var(--f-display)}
.fb{border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .exs{font:500 17px var(--f-display)}
.fb .tr{font-size:14px;color:var(--muted)}
.score{font:600 56px/1 var(--f-display);font-variant-numeric:tabular-nums}
.gain{display:flex;gap:14px;align-items:center;background:var(--coop);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.gain svg{width:76px;height:auto;flex:none}

/* ---------- chân trang ---------- */
.cta{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px}
.cta h3{font:italic 400 22px/1.3 var(--f-display)}
.foot{color:var(--muted);font-size:13px}
.stats{width:100%;border-collapse:collapse}
.stats td{padding:12px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.stats td:last-child{text-align:right;white-space:nowrap}

@media (max-width:920px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .coop{grid-template-columns:1fr}
  .hen{order:-1}
  .hen svg{max-width:260px}
}
@media (max-width:640px){
  #app{gap:24px}
  .grid{grid-template-columns:1fr;gap:16px}
  .levels{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .lv{padding:12px;gap:10px}
  .lv-tile{width:46px;height:46px;font-size:20px;border-radius:12px}
  .sec-no{font-size:36px}
  .brand-sub{display:none}
  .stages li span{font-size:10.5px}
  .stages b{width:26px;height:26px}
  .week i{width:28px;height:28px}
  .lrow{grid-template-columns:36px minmax(0,1fr);padding:12px 14px}
  .lno{width:36px;height:36px}
  .lstate{grid-column:2;text-align:left}
  .banner svg.ic-big{width:68px;height:68px}
  .banner h1{max-width:calc(100% - 74px)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Trang này tải dữ liệu từ thư mục data/ nên phải mở bằng Live Server (hoặc máy chủ web bất kỳ).
   Mở thẳng file .html (địa chỉ bắt đầu bằng file://) thì sẽ không tải được bài. */
(function(){
'use strict';
var KEY='fr-vocab-prototype-v2',OLD_KEY='fr-vocab-prototype-v1';
var TOPICS=null,DATA={};
var store={theme:'',progress:{}};
try{var raw=localStorage.getItem(KEY);
 if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object')store=Object.assign(store,p);}
 else{var old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(old&&typeof old==='object'){if(old.theme)store.theme=old.theme;if(old.pet)store.pet=old.pet;}}
}catch(e){}
if(!store.progress||typeof store.progress!=='object')store.progress={};
if(!store.days||typeof store.days!=='object')store.days={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

/* Đo sự kiện: chỉ lưu tên sự kiện, chủ điểm, mã bài và điểm số. Không lưu tên, email hay chữ học viên gõ. */
var EVT_KEY='fr-vocab-events-v1';
function track(n,p){try{var l=JSON.parse(localStorage.getItem(EVT_KEY)||'[]');l.push({n:n,t:Date.now(),p:p||{}});if(l.length>500)l=l.slice(-500);localStorage.setItem(EVT_KEY,JSON.stringify(l));}catch(e){}
 /* Gửi lên công cụ thống kê (Umami) nếu trang có nhúng script của nó. */
 try{if(window.umami&&typeof window.umami.track==='function')window.umami.track(n,p||{});}catch(e){}}
function stats(){
 var l=[];try{l=JSON.parse(localStorage.getItem(EVT_KEY)||'[]');}catch(e){}
 function c(n){return l.filter(function(e){return e.n===n;}).length;}
 var opened={};l.forEach(function(e){if(e.n==='topic_open'&&e.p)opened[e.p.topic]=1;});
 var fin=l.filter(function(e){return e.n==='practice_finish'&&e.p;});
 var avg=fin.length?Math.round(fin.reduce(function(s,e){return s+e.p.score;},0)/fin.length*10)/10:'—';
 var pass=fin.filter(function(e){return e.p.score>=8;}).length;
 var ps=c('practice_start');
 return [
  ['Lượt mở trang',c('page_view')],
  ['Số chủ điểm đã mở (khác nhau)',Object.keys(opened).length],
  ['Lượt bấm Nghe',c('audio_play')],
  ['Lượt bắt đầu luyện tập',ps],
  ['Lượt làm xong 10 câu',fin.length],
  ['Điểm trung bình (trên 10)',avg],
  ['Lượt đạt 8/10 trở lên',pass],
  ['Tỷ lệ đạt / bắt đầu luyện',ps?Math.round(pass/ps*100)+'%':'—'],
  ['Số bài hoàn thành (lần đầu đạt 8/10)',c('lesson_complete')],
  ['Số chủ điểm hoàn thành',c('topic_complete')],
  ['Lượt cho gà ăn',c('pet_feed')],
  ['Lượt bấm "Tìm hiểu khóa học"',c('cta_click')]
 ];
}
function statsView(){

  '<div class="panel"><h3>Số liệu trên trình duyệt này</h3>'+
  '<p class="hintline">Chỉ đếm trên máy này. Dùng để thử thiết kế số liệu.</p>'+
  '<table class="stats">'+rows+'</table></div>';

/* ---------- ngày học (streak): ghi lại ngày nào có học, theo giờ máy ---------- */
function dkey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function markDay(){var k=dkey(new Date());if(!store.days[k]){store.days[k]=1;
  /* chỉ giữ 120 ngày gần nhất cho nhẹ */
  var ks=Object.keys(store.days).sort();while(ks.length>120){delete store.days[ks.shift()];}
  save();}}
function streak(){
 var d=new Date();d.setHours(12,0,0,0);
 if(!store.days[dkey(d)])d.setDate(d.getDate()-1);
 var n=0;while(store.days[dkey(d)]){n++;d.setDate(d.getDate()-1);}
 return n;
}

/* ---------- nuôi gà: làm xong bài luyện thì có thức ăn, cho ăn thì gà lớn. Chỉ thưởng, không phạt.
   Lưu trong store.pet {food: thức ăn đang có, fed: số lần đã cho ăn}. Mốc cho ăn của 6 giai đoạn ở STAGES. ---------- */
var STAGES=[0,1,2,4,6,8]; /* bản thử nghiệm: gà lớn nhanh. Bản chính thức nên tăng, ví dụ [0,3,10,24,45,80] */
var STAGE_NAMES=['Quả trứng','Trứng nứt','Gà con','Gà choai','Gà trống','Gà Pháp'];
function pet(){var p=store.pet;if(!p||typeof p!=='object'){p=store.pet={food:0,fed:0};}p.food=Math.max(0,Math.floor(+p.food)||0);p.fed=Math.max(0,Math.floor(+p.fed)||0);return p;}
function stageOf(fed){var s=0;for(var i=0;i<STAGES.length;i++){if(fed>=STAGES[i])s=i;}return s;}

function coopView(){

 if(max)need='<strong>Gà đã lớn hết cỡ!</strong> Thức ăn còn lại để dành.';
 var steps='<ol class="stages">'+STAGE_NAMES.map(function(n,i){return '<li class="'+(i<s?'past':(i===s?'now':''))+'"'+(i===s?' aria-current="step"':'')+'><b>'+('0'+(i+1))+'</b><span>'+esc(n)+'</span></li>';}).join('')+'</ol>';
 /* tuần hiện tại, bắt đầu từ thứ Hai */
 var now=new Date();now.setHours(12,0,0,0);var mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
 var tk=dkey(now),labels=['T2','T3','T4','T5','T6','T7','CN'],week='';
 for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);var k=dkey(d),on=!!store.days[k],today=k===tk;
  week+='<li class="'+(on?'on ':'')+(today?'today':'')+'" aria-label="'+labels[i]+(on?': đã học':'')+(today?' (hôm nay)':'')+'">'+labels[i]+'<i>'+(on?'✓':'')+'</i></li>';}

function applyTheme(){var r=document.documentElement;if(store.theme==='dark'||store.theme==='light')r.setAttribute('data-theme',store.theme);else r.removeAttribute('data-theme');}
applyTheme();

var voice=null,ttsOK=false;
function pickVoice(){try{var vs=speechSynthesis.getVoices();voice=null;for(var i=0;i<vs.length;i++){if(/^fr([-_]|$)/i.test(vs[i].lang)){voice=vs[i];break;}}ttsOK=!!voice;}catch(e){ttsOK=false;}}
try{if('speechSynthesis' in window){pickVoice();speechSynthesis.addEventListener('voiceschanged',function(){var was=ttsOK;pickVoice();if(was!==ttsOK&&S.view!=='quiz')render();});}}catch(e){}
function speak(t){if(!ttsOK||!t)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.voice=voice;u.lang=voice.lang;u.rate=.85;speechSynthesis.speak(u);}catch(e){}}

var S={view:'home',topic:null,lesson:null,tab:'cards',idx:0,flip:false,list:false,quiz:null,cta:false,busy:'',err:''};
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return s.toLowerCase().replace(/’/g,"'").replace(/œ/g,'oe').replace(/-/g,' ').replace(/\s+/g,' ').trim();}
function strip(s){return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'');}
function spk(text,label){return '<button class="speak" data-a="speak" data-t="'+esc(text)+'"'+(ttsOK?'':' disabled title="Máy chưa có giọng đọc tiếng Pháp"')+'>🔊 '+esc(label==null?'Nghe':label)+'</button>';}

/* ---------- tải dữ liệu ---------- */
function getJSON(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});}
function loadTopics(){
 S.err='';
 if(TOPICS||S.busy)return;
 S.busy='topics';render();
 getJSON('data/topics.json').then(function(d){TOPICS=d;S.busy='';render();}).catch(function(){S.busy='';S.err='topics';render();});
}
function loadTopic(id){
 S.err='';
 if(DATA[id]){render();return;}
 S.busy='topic';render();
 getJSON('data/t'+(id<10?'0':'')+id+'.json').then(function(d){DATA[id]=d;S.busy='';render();}).catch(function(){S.busy='';S.err='topic';render();});
}
function loadBox(){
 if(S.busy)return '<p class="hintline">Đang tải…</p>';
 if(S.err)return '<div class="panel"><p>Không tải được bài, thử lại</p><div class="row"><button class="btn" data-a="retry">Thử lại</button></div></div>';
 return '';
}

/* ---------- tiến độ theo mã bài ---------- */
function best(lid){var p=store.progress[lid];return p?p.best:null;}
function lessonDone(lid){var b=best(lid);return b!==null&&b>=8;}
function topicInfo(id){if(!TOPICS)return null;for(var i=0;i<TOPICS.length;i++){if(TOPICS[i].id===id)return TOPICS[i];}return null;}
function doneCount(t){return t.lessons.filter(function(l){return lessonDone(l.id);}).length;}
function topicComplete(t){return doneCount(t)===t.lessons.length;}
function topicWords(d){var a=[];d.lessons.forEach(function(l){a=a.concat(l.words);});return a;}

/* ---------- nhãn loại từ ---------- */

 'np m':['tên riêng (giống đực)'],'np f':['tên riêng (giống cái)'],'np m pl':['tên riêng (giống đực, số nhiều)'],

/* ---------- quiz ---------- */
function lc(s){return String(s).toLowerCase().replace(/’/g,"'").trim();}
/* Đáp án nhiễu: lấy từ cả chủ điểm, ưu tiên cùng posGroup; loại từ cùng nghĩa, dễ nhầm, hoặc viMain/chữ trùng với đáp án đúng. */
function distractors(w,all){
 var seenVi={},seenFr={},out=[];
 seenVi[lc(w.viMain)]=1;seenFr[lc(w.fr)]=1;
 var cand=shuffle(all.filter(function(x){
  if(x===w||x.id===w.id)return false;
  if(w.sameMeaningGroup&&x.sameMeaningGroup===w.sameMeaningGroup)return false;
  if(w.confusableGroup&&x.confusableGroup===w.confusableGroup)return false;
  if(lc(x.viMain)===lc(w.viMain)||lc(x.fr)===lc(w.fr)||x.audioText===w.audioText)return false;
  return true;
 }));
 var same=cand.filter(function(x){return x.posGroup===w.posGroup;}),other=cand.filter(function(x){return x.posGroup!==w.posGroup;});
 same.concat(other).forEach(function(x){
  if(out.length>=3)return;
  var kv=lc(x.viMain),kf=lc(x.fr);
  if(seenVi[kv]||seenFr[kf])return;
  seenVi[kv]=1;seenFr[kf]=1;out.push(x);
 });
 return out;
}
function makeQ(t,w,all){
 var q={t:t,w:w,done:false,ok:null,picked:null,msg:''};
 if(t!=='type')q.opts=shuffle([w].concat(distractors(w,all)));
 return q;
}
/* 10 câu: chọn nghĩa 4, nghe chọn từ 3, gõ từ 3, xen kẽ. Mỗi từ tối đa 2 lần, không liền nhau. */
function buildQuiz(topicData,lesson){
 var words=lesson.words,all=topicWords(topicData);
 var seq=['meaning','listen','type','meaning','listen','type','meaning','listen','type','meaning'];
 var cnt={},used={},prev=null,qs=[];
 function pick(t){
  var pool=words.filter(function(w){return t!=='type'||w.typeable;});
  var c=pool.filter(function(w){return (cnt[w.id]||0)<2&&w!==prev;});
  if(!c.length&&t!=='type')c=pool.filter(function(w){return w!==prev;});
  if(!c.length)return null;
  c=c.map(function(w){return {w:w,k:(cnt[w.id]||0)*100+(used[t+w.id]||0)*10+Math.random()*5};}).sort(function(a,b){return a.k-b.k;});
  return c[0].w;
 }
 seq.forEach(function(t){
  if(t==='listen'&&!ttsOK)t='meaning';
  var w=pick(t);
  if(!w&&t==='type'){t='meaning';w=pick(t);}
  if(!w)w=words[0];
  cnt[w.id]=(cnt[w.id]||0)+1;used[t+w.id]=(used[t+w.id]||0)+1;prev=w;
  qs.push(makeQ(t,w,all));
 });
 return {tid:topicData.id,lid:lesson.id,qs:qs,i:0,score:0,finished:false};
}
function feedback(q){
 var w=q.w,right=q.t==='type'?w.fr:w.fr+' = '+w.vi;
 return '<div class="fb '+(q.ok?'good':'bad')+'"><strong>'+(q.ok?'Đúng rồi!':'Chưa đúng. Đáp án: '+esc(right))+'</strong>'+
  (q.msg?'<span class="tr">'+esc(q.msg)+'</span>':'')+
  '<span class="exs" lang="fr">'+esc(w.fr)+' = '+esc(w.vi)+'</span>'+(w.note?'<span class="tr">'+esc(w.note)+'</span>':'')+'<span>'+spk(w.audioText)+'</span></div>';
}

 h+='<button class="back" data-a="leave">← Thoát</button><div class="panel"><div class="qhead"><span class="qtype">'+esc(names[q.t])+'</span><span>'+(Q.i+1)+' / '+Q.qs.length+'</span></div><div class="bar"><i style="width:'+Math.round(Q.i/Q.qs.length*100)+'%"></i></div>';

   return '<button class="'+c+'" data-a="pick" data-i="'+i+'"'+(q.done?' disabled':'')+'>'+esc(q.t==='meaning'?o.viMain:o.fr)+'</button>';}).join('')+'</div>';
 }else{
  h+='<div class="big"><span>'+esc(w.vi)+'</span>'+spk(w.audioText,'')+'</div><p class="hintline">'+esc(posLabel(w))+'</p>'+

 }

 return h+'</div>';
}

function finishQuiz(Q){
 Q.finished=true;
 var pr=store.progress[Q.lid]||{best:0,tries:0},first=pr.best<8&&Q.score>=8;
 pr.best=Math.max(pr.best,Q.score);pr.tries=(pr.tries||0)+1;store.progress[Q.lid]=pr;
 Q.gain=1+(Q.score>=8?2:0);pet().food+=Q.gain;markDay();save();
 track('pet_food_earned',{topic:Q.tid,lesson:Q.lid,amount:Q.gain});
 track('practice_finish',{topic:Q.tid,lesson:Q.lid,score:Q.score});
 if(first){track('lesson_complete',{topic:Q.tid,lesson:Q.lid});var ti=topicInfo(Q.tid);if(ti&&topicComplete(ti))track('topic_complete',{topic:Q.tid});}
}
function feed(n){
 var pt=pet(),before=stageOf(pt.fed),k=0;
 while(k<n&&pt.food>0&&stageOf(pt.fed)<STAGES.length-1){pt.food--;pt.fed++;k++;}
 if(!k)return;
 var after=stageOf(pt.fed);save();track('pet_feed',{stage:after,amount:k});
 if(after>before){S.petFx='grow';S.petMsg='Gà đã lớn thành '+STAGE_NAMES[after].toLowerCase()+'!';track('pet_stage',{stage:after});}
 else{S.petFx='eat';S.petMsg=k>1?'Gà ăn liền '+k+' phần, no căng!':'Gà mổ thóc ngon lành!';}
 render();
}

function act(a,b){
 var Q=S.quiz,q=Q&&Q.qs&&Q.qs[Q.i];
 switch(a){
  case 'theme':var cur=document.documentElement.getAttribute('data-theme');var dark=cur?cur==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;store.theme=dark?'light':'dark';applyTheme();save();break;
  case 'open':S.topic=+b.dataset.v;track('topic_open',{topic:S.topic});S.view='topic';S.lesson=null;loadTopic(S.topic);window.scrollTo(0,0);break;
  case 'lesson':
   var d=DATA[S.topic],L=d&&d.lessons.filter(function(l){return l.id===b.dataset.v;})[0];
   if(L){S.lesson=L;S.view='lesson';S.tab='cards';S.idx=0;S.flip=false;S.list=false;render();window.scrollTo(0,0);}
   break;
  case 'totopic':S.view='topic';S.lesson=null;S.quiz=null;render();window.scrollTo(0,0);break;
  case 'home':goHome();window.scrollTo(0,0);break;
  case 'tolist':var el=document.getElementById('chu-diem');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'tocoop':goHome();var c=document.querySelector('.coop');if(c)c.scrollIntoView({block:'start'});break;
  case 'retry':if(S.view==='home')loadTopics();else loadTopic(S.topic);break;
  case 'tab':S.tab=b.dataset.v;render();break;
  case 'mode':S.list=!S.list;markDay();render();break;
  case 'flip':S.flip=!S.flip;markDay();render();break;
  case 'prev':S.idx=(S.idx+S.lesson.words.length-1)%S.lesson.words.length;S.flip=false;render();break;
  case 'next':
   if(S.view==='lesson'){S.idx=(S.idx+1)%S.lesson.words.length;S.flip=false;render();}
   else if(Q){if(Q.i<Q.qs.length-1){Q.i++;}else{finishQuiz(Q);}render();window.scrollTo(0,0);}
   break;
  case 'feed':feed(1);break;
  case 'feedall':feed(9999);break;
  case 'speak':track('audio_play',{topic:S.topic,lesson:S.lesson?S.lesson.id:null});speak(b.dataset.t);break;
  case 'start':track('practice_start',{topic:S.topic,lesson:S.lesson.id});S.quiz=buildQuiz(DATA[S.topic],S.lesson);S.view='quiz';render();window.scrollTo(0,0);break;
  case 'leave':S.view='lesson';S.tab='practice';S.quiz=null;render();window.scrollTo(0,0);break;
  case 'cta':if(!S.cta)track('cta_click',{topic:S.topic});S.cta=!S.cta;render();break;
  case 'pick':
   if(!q||q.done)break;var i=+b.dataset.i;q.picked=i;
   answer(q,q.opts[i]===q.w);
   render();break;
  case 'ins':var inp=document.getElementById('ans');if(inp&&!inp.disabled){var s=inp.selectionStart==null?inp.value.length:inp.selectionStart,e2=inp.selectionEnd==null?s:inp.selectionEnd;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e2);inp.focus();var pos=s+b.dataset.c.length;try{inp.setSelectionRange(pos,pos);}catch(x){}}break;
  case 'check':
   if(!q||q.done||q.t!=='type')break;
   var v=(document.getElementById('ans')||{}).value||'';
   if(!v.trim()){q.msg='Hãy gõ một từ.';render();break;}
   var ok=q.w.accept.some(function(x){return norm(x)===norm(v);});
   var near=!ok&&q.w.accept.some(function(x){return strip(x)===strip(v);});
   answer(q,ok,near?'Gần đúng, kiểm tra dấu.':'');render();
   break;
 }
}
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b);});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();act('check',e.target);}});
track('page_view');
if(location.hash==='#thongke')S.view='stats';
/* Chỉ để chạy kiểm tra tự động: mở trang với #kiemtra thì mới có window.FRV. */
if(location.hash==='#kiemtra')window.FRV={buildQuiz:buildQuiz,setTTS:function(v){ttsOK=!!v;},store:store,render:render};
render();
if(location.protocol!=='file:')loadTopics();
})();
</script>
